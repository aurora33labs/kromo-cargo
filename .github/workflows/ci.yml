name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kromo
          POSTGRES_PASSWORD: kromo
          POSTGRES_DB: kromo
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kromo" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Pruebas con SQLite
        run: bun test
      - name: Pruebas con Postgres
        run: bun test
        env:
          TEST_DATABASE_URL: postgres://kromo:kromo@localhost:5432/kromo
      - name: Compila el ejecutable
        run: bun run build && ./apps/cargo/dist/kromo-cargo version
